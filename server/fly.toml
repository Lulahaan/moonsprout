# Fly.io app for the official lobby (plan section 2.11). Example only: not deployed by the project.
#   fly launch --copy-config --no-deploy   (pick your own app name), then fly deploy
app = "mppm-server-example"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "mppm_server=info,warn"
  # Cloudflare Realtime TURN credentials (relay mode cloudflare) wait for the libjuice-against-
  # Cloudflare-TURN spike; the server refuses to start with this mode until then.
  # MPPM_RELAY_MODE = "cloudflare"

[experimental]
  # Appended to the image ENTRYPOINT (which already binds 0.0.0.0:8080): Fly sets Fly-Client-IP.
  cmd = ["--trust-proxy"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Phase 2 (leaderboards in SQLite). Create it with: fly volumes create mppm_data --size 1 --region iad
[mounts]
  source = "mppm_data"
  destination = "/data"
