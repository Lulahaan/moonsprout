<?xml version="1.0" encoding="UTF-8"?>
<!-- Controller silhouette for the Controllers window (res/img/pad.png, rendered at 3x:
     magick -background none -density 288 port/launcher/art/pad.svg port/launcher/res/img/pad.png).
     The buttons are separate elements laid over it (res/rml/controller.rcss) so they can light up. -->
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="172" viewBox="0 0 260 172">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34509C"/>
      <stop offset="0.55" stop-color="#22377A"/>
      <stop offset="1" stop-color="#18285E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD3F2"/>
      <stop offset="1" stop-color="#4F86B0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <path id="shell" d="M70 30 H190 C222 30 240 50 240 78 C240 100 244 130 236 150 C230 166 206 172 190 164
      C178 158 172 140 160 126 C150 116 140 114 130 114 C120 114 110 116 100 126 C88 140 82 158 70 164
      C54 172 30 166 24 150 C16 130 20 100 20 78 C20 50 38 30 70 30 Z"/>
    <clipPath id="clip"><use href="#shell"/></clipPath>
  </defs>
  <use href="#shell" fill="url(#fill)" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round"/>
  <!-- glass sheen over the upper body -->
  <g clip-path="url(#clip)">
    <path d="M20 30 H240 V70 C200 60 160 56 130 56 C100 56 60 60 20 70 Z" fill="url(#sheen)"/>
  </g>
  <!-- recessed wells under the two sticks -->
  <circle cx="66" cy="66" r="25" fill="#0B1538" fill-opacity="0.45"/>
  <circle cx="66" cy="66" r="25" fill="none" stroke="#9FD3F2" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="170" cy="108" r="18" fill="#0B1538" fill-opacity="0.45"/>
  <circle cx="170" cy="108" r="18" fill="none" stroke="#9FD3F2" stroke-opacity="0.18" stroke-width="1"/>
</svg>
