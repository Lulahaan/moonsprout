<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Moonsprout pre-disc rocket. Original artwork, generated by tools/launcher_art/gen_backdrop.py. -->
  <defs>
    <clipPath id="bodyClip"><path d="M 256,112 C 300,138 351,236 351,318 C 351,386 309,424 256,424 C 203,424 161,386 161,318 C 161,236 212,138 256,112 Z"/></clipPath>
    <radialGradient id="bulbFill" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DDF1FF"/>
      <stop offset="1" stop-color="#9FCBEB"/>
    </radialGradient>
    <radialGradient id="portFill" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#2A4C8F"/>
      <stop offset="0.6" stop-color="#14275A"/>
      <stop offset="1" stop-color="#0B1730"/>
    </radialGradient>
    <radialGradient id="ballFill" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFF4B8"/>
      <stop offset="0.5" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#E9A91C"/>
    </radialGradient>
    <linearGradient id="nozzleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E7FB8"/>
      <stop offset="0.5" stop-color="#4A5A92"/>
      <stop offset="1" stop-color="#2C3A6E"/>
    </linearGradient>
  </defs>

  <!-- faint cyan rim so the navy outline separates from a navy sky -->
  <g fill="#6FB6DE" stroke="#6FB6DE" stroke-width="27" stroke-linejoin="round" stroke-linecap="round"
     opacity="0.4">
    <path d="M 256,76 L 262,56 L 268,36"/>
    <circle cx="270" cy="30" r="11"/>
    <path d="M -29,-20 L 29,-20 C 33,41.4 30,72 20,86 A 20,20 0 0 1 -20,86 C -30,72 -33,41.4 -29,-20 Z" transform="translate(186 368) rotate(25)"/><path d="M -29,-20 L 29,-20 C 33,41.4 30,72 20,86 A 20,20 0 0 1 -20,86 C -30,72 -33,41.4 -29,-20 Z" transform="translate(326 368) rotate(-25)"/>
    <path d="M 222,410 L 290,410 L 298,446 C 298,456 214,456 214,446 Z"/>
    <path d="M 256,112 C 300,138 351,236 351,318 C 351,386 309,424 256,424 C 203,424 161,386 161,318 C 161,236 212,138 256,112 Z"/>
    <path d="M 249,356 C 249,348 263,348 263,356 L 276,440 C 278,452 272,458 262,458 L 250,458 C 240,458 234,452 236,440 Z"/>
    <circle cx="256" cy="118" r="45"/></g>
  <!-- silhouette outline: 10 px of navy outside every part -->
  <g fill="#0B1730" stroke="#0B1730" stroke-width="20" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 256,76 L 262,56 L 268,36"/>
    <circle cx="270" cy="30" r="11"/>
    <path d="M -29,-20 L 29,-20 C 33,41.4 30,72 20,86 A 20,20 0 0 1 -20,86 C -30,72 -33,41.4 -29,-20 Z" transform="translate(186 368) rotate(25)"/><path d="M -29,-20 L 29,-20 C 33,41.4 30,72 20,86 A 20,20 0 0 1 -20,86 C -30,72 -33,41.4 -29,-20 Z" transform="translate(326 368) rotate(-25)"/>
    <path d="M 222,410 L 290,410 L 298,446 C 298,456 214,456 214,446 Z"/>
    <path d="M 256,112 C 300,138 351,236 351,318 C 351,386 309,424 256,424 C 203,424 161,386 161,318 C 161,236 212,138 256,112 Z"/>
    <path d="M 249,356 C 249,348 263,348 263,356 L 276,440 C 278,452 272,458 262,458 L 250,458 C 240,458 234,452 236,440 Z"/>
    <circle cx="256" cy="118" r="45"/></g>

  <!-- antenna -->
  <path d="M 256,80 L 262,56 L 268,38" fill="none" stroke="#C9D8F2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="270" cy="30" r="11" fill="url(#ballFill)"/>
  <circle cx="266.5" cy="26.5" r="3.2" fill="#FFFFFF" opacity="0.85"/>

  <!-- side fins and nozzle sit behind the body -->
  <g fill="#C8284F" stroke="#0B1730" stroke-width="6" stroke-linejoin="round"><path d="M -29,-20 L 29,-20 C 33,41.4 30,72 20,86 A 20,20 0 0 1 -20,86 C -30,72 -33,41.4 -29,-20 Z" transform="translate(186 368) rotate(25)"/><path d="M -29,-20 L 29,-20 C 33,41.4 30,72 20,86 A 20,20 0 0 1 -20,86 C -30,72 -33,41.4 -29,-20 Z" transform="translate(326 368) rotate(-25)"/></g>
  <path d="M 172,380 C 164,404 154,426 146,440" fill="none" stroke="#F06A8C" stroke-width="7" stroke-linecap="round"/>
  <path d="M 222,410 L 290,410 L 298,446 C 298,456 214,456 214,446 Z" fill="url(#nozzleFill)" stroke="#0B1730" stroke-width="6" stroke-linejoin="round"/>

  <!-- body with its two shading bands -->
  <path d="M 256,112 C 300,138 351,236 351,318 C 351,386 309,424 256,424 C 203,424 161,386 161,318 C 161,236 212,138 256,112 Z" fill="#E63C66"/>
  <g clip-path="url(#bodyClip)">
    <path d="M 120,90 L 236,90 C 206,190 200,330 232,440 L 120,440 Z" fill="#FF7A98"/>
    <path d="M 392,90 L 322,90 C 338,200 340,330 318,440 L 392,440 Z" fill="#9E1F3D"/>
    <!-- belly shadow where the fins attach -->
    <ellipse cx="256" cy="432" rx="120" ry="34" fill="#9E1F3D" opacity="0.45"/>
    <!-- shadow of the bulb on the nose -->
    <ellipse cx="262" cy="166" rx="48" ry="16" fill="#9E1F3D" opacity="0.55"/>
    <!-- specular streak -->
    <path d="M 196,228 C 186,262 184,300 190,336" fill="none" stroke="#FFFFFF" stroke-width="13"
          stroke-linecap="round" opacity="0.55"/>
    <circle cx="198" cy="206" r="6.5" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <path d="M 256,112 C 300,138 351,236 351,318 C 351,386 309,424 256,424 C 203,424 161,386 161,318 C 161,236 212,138 256,112 Z" fill="none" stroke="#0B1730" stroke-width="6" stroke-linejoin="round"/>

  <!-- porthole -->
  <circle cx="256" cy="282" r="35" fill="#DDF1FF" stroke="#0B1730" stroke-width="6"/>
  <circle cx="256" cy="282" r="25" fill="url(#portFill)" stroke="#0B1730" stroke-width="4"/>
  <path d="M 239,276 A 18,18 0 0 1 256,264" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="267" cy="294" r="3" fill="#BFE6FF" opacity="0.7"/>

  <!-- front fin -->
  <path d="M 249,356 C 249,348 263,348 263,356 L 276,440 C 278,452 272,458 262,458 L 250,458 C 240,458 234,452 236,440 Z" fill="#C8284F" stroke="#0B1730" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 254,366 L 248,446" fill="none" stroke="#F06A8C" stroke-width="5" stroke-linecap="round"/>

  <!-- glass nose bulb -->
  <circle cx="256" cy="118" r="45" fill="url(#bulbFill)" stroke="#0B1730" stroke-width="6"/>
  <path d="M 228,108 A 30,30 0 0 1 250,86" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <circle cx="236" cy="124" r="4.5" fill="#FFFFFF"/>
  <path d="M 278,140 A 30,30 0 0 0 290,118" fill="none" stroke="#8DB8DA" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
